$HTTP["url"] =~ "^/vnstat/" {
  alias.url = ( "/vnstat/" => "/var/www/vnstat-web/" )
}

$HTTP["url"] !~ "^/vnstat/" {
  alias.url += ( "/" => "/var/www/vnstat-web/" )
}

server.modules += ( "mod_alias", "mod_cgi" )
alias.url += ( "/cgi-bin/" => "/usr/lib/cgi-bin/" )
$HTTP["url"] =~ "^/cgi-bin/" {
  cgi.assign += ( ".cgi" => "/bin/bash" )
}

# 防扫描：常见探测路径直接拒绝
$HTTP["url"] =~ "(?i)^/(\.env|wp-admin|wp-login\.php|phpmyadmin|\.git|\.svn|\.DS_Store)" {
  url.access-deny = ( "" )
}

# 防直访二级数据文件：仅允许通过受保护 CGI 获取
$HTTP["url"] =~ "^/vnstat/(vnstat(_5min)?\.json|summary\.txt|server_time\.json|quota\.json|hourly\.png|daily\.png|monthly\.png)$" {
  url.access-deny = ( "" )
}
