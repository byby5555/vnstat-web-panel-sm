<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>vnstat-web 登录</title>
  <style>
    body{margin:0;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh}
    .box{width:min(420px,92vw);background:#111827;border:1px solid #334155;border-radius:12px;padding:18px}
    h1{margin:0 0 12px;font-size:18px}
    label{display:block;font-size:13px;color:#94a3b8;margin:10px 0 6px}
    input{width:100%;box-sizing:border-box;background:#0b1220;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:10px}
    button{margin-top:14px;width:100%;background:#2563eb;border:0;color:#fff;border-radius:8px;padding:10px;font-size:14px;cursor:pointer}
    .err{margin-top:8px;color:#f87171;font-size:12px;min-height:18px}
    .muted{margin-top:8px;color:#94a3b8;font-size:12px}
  </style>
</head>
<body>
  <div class="box">
    <h1>登录 vnstat-web</h1>
    <label>用户名</label>
    <input id="username" type="text" autocomplete="username" />
    <label>密码</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="btnLogin">登录</button>
    <div class="err" id="err"></div>
    <div class="muted">提示：连续 5 次失败会封锁来源 IP。</div>
  </div>
<script>
const AUTH_API='/cgi-bin/vnstat-web-auth.cgi';
const SESSION_KEY='vnstat_session_token';
const params=new URLSearchParams(location.search);
const next=params.get('next') || '/vnstat/';

function getToken(){ return localStorage.getItem(SESSION_KEY)||''; }
function setToken(t){ if(t) localStorage.setItem(SESSION_KEY,t); else localStorage.removeItem(SESSION_KEY); }

async function auth(payload){
  const r=await fetch(AUTH_API,{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':getToken()},body:JSON.stringify({...payload,session_token:getToken()})});
  const raw=await r.text();
  let data=null;
  try{ data=raw ? JSON.parse(raw) : null; }catch(e){}
  if(!r.ok){
    const msg=(data && (data.err || data.message)) || raw || (`HTTP ${r.status}`);
    throw new Error(msg);
  }
  if(!data) throw new Error('认证接口返回了无效响应');
  return data;
}

(async ()=>{
  try{
    const j=await auth({action:'status'});
    if(j && j.authenticated){ location.href=next; }
  }catch(e){}
})();

document.getElementById('btnLogin').onclick=async ()=>{
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  err.textContent='';
  if(!username || !password){ err.textContent='请输入用户名和密码'; return; }
  try{
    const j=await auth({action:'login',username,password});
    if(j.ok && j.session_token){
      setToken(j.session_token);
      location.href=next;
    }else{
      err.textContent='登录失败：'+(j.err||'unknown');
    }
  }catch(e){
    err.textContent='登录失败：'+(e && e.message ? e.message : '网络异常');
  }
};
</script>
</body>
</html>
